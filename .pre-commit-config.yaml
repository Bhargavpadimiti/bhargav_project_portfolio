# Git hooks that run automatically on every commit.
# Install once with:  python scripts/portfolio.py setup   (or: make setup)
# Run on everything:  pre-commit run --all-files
# Update versions:    pre-commit autoupdate
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      # Work happens on branches and lands via pull requests.
      # Emergency bypass: git commit --no-verify
      - id: no-commit-to-branch
        args: [--branch, main]

  # Block API keys, tokens and passwords before they reach GitHub
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Python: lint + format (config in ruff.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Markdown style (config in .markdownlint-cli2.yaml)
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.1
    hooks:
      - id: markdownlint-cli2

  # GitHub Actions workflow linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Commit messages must follow Conventional Commits (feat:, fix:, docs: ...)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
